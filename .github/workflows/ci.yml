name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
            extras: dev
          - os: ubuntu-latest
            python-version: "3.12"
            extras: dev
          - os: windows-latest
            python-version: "3.8"
            extras: dev,gui
          - os: windows-latest
            python-version: "3.12"
            extras: dev
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 脱敏审计的历史模式要全历史 blob；浅克隆下该模式命中数为 0 属正常形态，不判失败
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install toolchain first"
        run: python -m pip install -U pip setuptools wheel

      - name: "Install package with declared extras"
        run: python -m pip install -e ".[${{ matrix.extras }}]"

      - name: "Collect count per test file"
        run: python -X utf8 -m pytest --collect-only -q | grep -E "^[a-zA-Z0-9_./\\\\]+::" | awk -F"::" "{c[\$1]++} END {for (f in c) print f, c[f]}" | sort

      - name: "Run tests with skip reasons visible"
        run: python -X utf8 -m pytest -rs

      - name: "Contract selfcheck"
        run: python -X utf8 -m pmc selfcheck

      - name: "Synthetic artifacts are byte-reproducible"
        run: python -X utf8 -m pmc synth --check

      - name: "Benchmark on the synthetic-grade plane must meet every gate"
        run: python -X utf8 -m pmc bench --all --json

      - name: "Ledger plane must stay degraded (expected exit 1)"
        shell: bash
        run: |
          set +e
          python -X utf8 -m pmc bench --plane ledger --markdown
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 on the ledger plane, got $code"
            exit 1
          fi
          echo "ledger plane correctly reports unavailable metrics"

      - name: "CLI help surface"
        run: python -X utf8 -m pmc --help

      - name: "Desensitization auditor is not idle (positive controls)"
        run: python -X utf8 scripts/desensitize_audit.py --selftest

      - name: "Desensitization gate on the tracked tree"
        run: python -X utf8 scripts/desensitize_audit.py --mode tracked

      - name: "Desensitization gate on commit metadata"
        run: python -X utf8 scripts/desensitize_audit.py --mode messages

      - name: "Desensitization gate on full history (registry-checked)"
        run: python -X utf8 scripts/desensitize_audit.py --mode history
